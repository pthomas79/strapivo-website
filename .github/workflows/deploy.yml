name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Strip git metadata
        # Vercel Hobby plan blocks deploys whose git author email isn't a verified
        # Vercel account. Removing .git makes Vercel treat this as a plain CLI deploy.
        run: rm -rf .git

      - name: Deploy to production
        run: >
          vercel deploy
          --prod
          --yes
          --name strapivo-website
          --token=${{ secrets.VERCEL_TOKEN }}
