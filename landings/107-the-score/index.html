<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#FBF6E9;color:#16130d;-webkit-text-size-adjust:100%}
body{font:400 20px/1.4 Cormorant,Georgia,serif;overflow-x:hidden}
a{color:inherit}
a:focus-visible{outline:2px solid #1D3F8F;outline-offset:4px}
.pin{position:relative}
.motion .pin{height:300vh}
.stage{display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;min-height:100svh;padding:28px clamp(20px,4vw,56px) 24px}
.motion .stage{position:sticky;top:0;height:100vh;height:100svh}
header{display:flex;justify-content:space-between;align-items:center}
.logo img{display:block;height:24px;width:auto}
.signin{font-size:16px;letter-spacing:.02em;text-decoration:underline;text-underline-offset:4px}
.lede{max-width:1100px}
h1{text-wrap:balance;font-weight:500;font-size:clamp(40px,6.4vw,92px);line-height:.98;letter-spacing:-.015em}
.lede p{margin-top:16px;font-size:clamp(19px,1.9vw,26px);max-width:34em;line-height:1.3}
.score{width:100%}
.sv{display:block;width:100%;height:auto;overflow:visible}
.sv-p{display:none}
.ln{font-family:"Cormorant SC",Georgia,serif;font-weight:600;font-size:17px;fill:#16130d;letter-spacing:.03em}
.it,.mk{font-family:Cormorant,Georgia,serif;font-style:italic;font-weight:500;font-size:22px;fill:#16130d}
.mk{fill:#1D3F8F}
.wk,.sm{font-family:Cormorant SC,Georgia,serif;font-weight:600;font-size:16px;fill:#16130d;letter-spacing:.04em}
.sm{font-family:Cormorant,Georgia,serif;font-style:italic;font-weight:500;letter-spacing:0;font-size:16px}
.ph{display:none}
.motion .ph{display:block}
.n{transition:opacity .35s ease}
.tie{stroke-dasharray:1;stroke-dashoffset:0}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.after{font-size:clamp(19px,1.9vw,26px);font-style:italic;max-width:22em}
.cta{display:inline-block;margin-top:14px;padding:14px 26px;background:#16130d;color:#FBF6E9;text-decoration:none;font-size:20px;letter-spacing:.02em;font-weight:500}
.cta:hover{background:#1D3F8F}
.cta:focus-visible{outline:2px solid #1D3F8F;outline-offset:4px}
footer{font-size:13px;opacity:.8}
footer a{margin-left:12px}
@media (max-width:760px){
 body{font-size:18px}
 .sv-d{display:none}.sv-p{display:block}
 .motion .pin{height:auto}
 .motion .stage{position:static;height:auto;min-height:100svh}
 .stage{gap:18px;padding:20px 20px 20px}
 .logo img{height:20px}
 h1{font-size:42px}
 .lede p{font-size:19px}
 .ln{font-size:15px}.it,.mk{font-size:17px}.wk,.sm{font-size:14.5px}
 .foot{display:block}
 .cta{display:block;text-align:center;margin-top:14px}
 .after{font-size:19px}
}
@media (max-height:640px) and (min-width:761px){h1{font-size:44px}.lede p{margin-top:8px}}
</style>

<script>
(function(){
var root=document.documentElement;
if(!root.classList.contains("motion"))return;
var pin=document.getElementById("pin");
var wide=matchMedia("(min-width:761px)");
var X0=200,BW=97.5,X1=1370;
var ph=document.querySelector(".ph");
var vis=true,raf=0,lastF=-1;
function setF(f){ // f = number of bars passed, 0..12
 document.querySelectorAll(".sv").forEach(function(sv){
  sv.querySelectorAll(".n").forEach(function(n){n.style.opacity=(+n.dataset.i+0.5<=f)?1:0;});
  var tt=Math.max(0,Math.min(1,(f-4.5)/5));
  var t=sv.querySelectorAll(".tie");
  if(t.length==1)t[0].style.strokeDashoffset=1-tt;
  else if(t.length==2){t[0].style.strokeDashoffset=1-Math.min(1,tt*2);t[1].style.strokeDashoffset=1-Math.max(0,tt*2-1);}
 });
 if(ph){var x=X0+f/12*(X1-X0);ph.setAttribute("x1",x);ph.setAttribute("x2",x);}
}
function scroll(){
 raf=0;
 if(!wide.matches)return;
 var r=pin.getBoundingClientRect(),max=r.height-innerHeight;
 var p=max>0?Math.min(1,Math.max(0,-r.top/max)):0;
 var f=4+p*8.2; if(f>12)f=12;
 setF(f);
}
function req(){if(!raf)raf=requestAnimationFrame(scroll);}
// phone: plays once on its own
var played=false;
function play(){
 if(played)return;played=true;
 var t0=null;
 function step(ts){
  if(t0===null)t0=ts;
  var f=Math.min(12,(ts-t0)/5200*12);
  setF(f);
  if(f<12&&!document.hidden)requestAnimationFrame(step);
  else if(f<12){played=false;}
 }
 setF(0);requestAnimationFrame(step);
}
function init(){
 if(wide.matches){scroll();}
 else setF(12);
}
addEventListener("scroll",req,{passive:true});
addEventListener("resize",function(){if(wide.matches)req();else if(!played)setF(12);});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!wide.matches&&!played&&lastF<0){}});
init();
})();
</script>
