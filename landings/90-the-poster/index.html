<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strapivo. Strategy finally has a home.</title>
<meta name="description" content="Strapivo is where a leadership team keeps its strategy and corrects it every week.">
<link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block" rel="stylesheet">
<style>
:root{
  --ground:#F2581C;
  --ink:#141210;
  --paper:#F8F0E3;
  --pf:max(min(68vw,40vh),33vh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ground);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-variation-settings:"wdth" 100;
  -webkit-font-smoothing:antialiased;
}
.poster{position:fixed;inset:0;overflow:hidden}

/* the image: one word, cropped by the edges */
h1{font-weight:inherit;font-size:inherit}
.big{
  --f:min(34vw,82vh);
  position:absolute;
  left:-2.4vw;
  bottom:calc(6.2vh - .166em);
  font-size:var(--f);
  line-height:1;
  font-weight:860;
  font-variation-settings:"wdth" 72;
  letter-spacing:-.035em;
  white-space:nowrap;
  animation:pan 90s ease-in-out infinite alternate;
}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(-3.5vw)}}
/* the rest of the line lives in the gap between the two t's */
.rest{
  position:absolute;
  left:27.4%;
  bottom:70.4%;
  font-size:.06em;
  line-height:1;
  font-weight:620;
  font-variation-settings:"wdth" 100;
  letter-spacing:-.01em;
  white-space:nowrap;
}

/* the credit block, top right, like the date and venue */
.credit{
  position:absolute;
  top:6vh;right:4vw;
  width:max(270px,24vw);
  font-size:max(15px,1.15vw);
  line-height:1.4;
  font-weight:480;
}
.credit p+p{margin-top:.8em;font-weight:680}
.act{display:flex;align-items:center;gap:1.5em;margin-top:1.7em}
.btn{
  display:inline-block;
  background:var(--paper);color:var(--ink);
  font-weight:680;text-decoration:none;white-space:nowrap;
  padding:.9em 1.35em;border-radius:999px;
  transition:background .2s,color .2s;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.sign{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em;font-weight:520}
a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* the bottom edge: logo and legal line, tiny */
.edge{
  position:absolute;left:4vw;bottom:2.1vh;
  display:flex;align-items:center;gap:22px;
  font-size:12px;font-weight:500;line-height:1;
}
.logo{display:block;line-height:0}
.logo img{height:15px;width:auto;display:block}
.edge nav{display:flex;gap:14px}
.edge a{color:var(--ink);text-decoration:none}
.edge nav a:hover{text-decoration:underline}

/* portrait: the word runs up the side */
@media (orientation:portrait){
  .big{
    --f:var(--pf);
    left:-.11em;
    bottom:auto;
    top:calc(50vh + 1.549em);
    transform-origin:0 0;
    transform:rotate(-90deg);
    animation:none;
  }
  .credit{
    top:auto;bottom:calc(12vh + 30px);right:5vw;
    left:calc(.74 * var(--pf) + 5vw);
    width:auto;
    font-size:max(15px,1.6vw);
  }
  .act{flex-direction:column;align-items:flex-end;gap:14px;margin-left:-40vw}
  .edge{left:auto;right:5vw;bottom:2.4vh;flex-direction:column;align-items:flex-end;gap:10px}
  .logo{position:fixed;top:4.4vh;right:5vw}
  .logo img{height:16px}
}

@media (prefers-reduced-motion:reduce){.big{animation:none}}
</style>
</head>
<body>
<main class="poster">
  <h1><span class="big">Strategy <span class="rest">finally has a home.</span></span></h1>
  <div class="credit">
    <p>Strapivo is where a leadership team keeps its strategy and corrects it every week.</p>
    <p>For chief executives and their teams.</p>
    <div class="act">
      <a class="btn" href="mailto:strategy@strapivo.com">Start the conversation</a>
      <a class="sign" href="https://strapivo.app">Sign in</a>
    </div>
  </div>
  <footer class="edge">
    <a class="logo" href="#"><img src="../../assets/logo/strategy-mono-ink.svg" alt="Strapivo"></a>
    <span>© 2026 Strapivo</span>
    <nav aria-label="Legal"><a href="/imprint">Imprint</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></nav>
  </footer>
</main>
</body>
</html>
