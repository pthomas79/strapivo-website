<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Strapivo. Every decision carries its marks.</title>
<meta name="description" content="Strapivo is where a leadership team decides its strategy and traces each decision to its evidence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#2B2E33;--lo:#B9BDC2;--hi:#EEF0F2}
html{background:#B9BDC2}
body{font-family:'Inter',system-ui,sans-serif;color:var(--g);-webkit-font-smoothing:antialiased;
 background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 3px),
  linear-gradient(135deg,var(--lo) 0%,#D3D6DA 50%,var(--hi) 100%);
 background-attachment:fixed}
a{color:inherit}
a:focus-visible{outline:2px solid var(--g);outline-offset:4px}
.track{position:relative}
.stage{min-height:100vh;display:flex;flex-direction:column;padding:clamp(24px,3.5vw,52px) clamp(24px,5vw,72px) 22px}
.logo{display:block;width:150px;height:auto;margin-bottom:clamp(20px,3.5vh,44px)}
.logo img{display:block;width:100%}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(40px,5.2vw,78px);line-height:1;letter-spacing:-.015em;max-width:11em;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.lede{margin-top:18px;max-width:34em;font-size:clamp(15px,1.25vw,18px);line-height:1.5}
.cta{display:inline-block;margin-top:22px;padding:13px 22px;background:var(--g);color:var(--hi);text-decoration:none;font-size:15px;font-weight:500;letter-spacing:.01em;box-shadow:0 1px 0 rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.18)}
.cta:hover{background:#000}
.row{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(14px,4vw,64px);padding:3vh 0}
.m{width:12vw;min-width:110px;max-width:200px;text-align:center}
.m svg{display:block;width:100%;height:auto;overflow:visible}
.m figcaption{margin-top:14px;font-size:14px;line-height:1.3;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:opacity .5s ease .1s}
.scribe{fill:none;stroke:#7B8086;stroke-width:1;stroke-dasharray:3 3}
.body{transition:opacity .08s linear}
.lt{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2.4}
.dk{fill:none;stroke:rgba(30,33,38,.55);stroke-width:2.4}
.fl{fill:#A2A7AD}
.ink{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;text-anchor:middle}
.ink.s{fill:rgba(30,33,38,.6)}
.ink.r{fill:#E9EBEE}
.tick{fill:none;stroke-linecap:round;stroke-linejoin:round}
.end{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;padding-top:6px}
.sds{font-family:ui-monospace,'JetBrains Mono',Menlo,monospace;font-size:14px;letter-spacing:.08em;transition:opacity .5s}
.last{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(22px,2vw,30px);letter-spacing:-.005em;transition:opacity .5s}
.last a{text-decoration-thickness:1px;text-underline-offset:5px}
footer{margin-top:22px;font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
footer a{text-underline-offset:3px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.js-on .track{height:300vh}
.js-on .stage{position:sticky;top:0;height:100vh;min-height:0}
.js-on .m:not(.on) .body{opacity:0}
.js-on .m:not(.on) figcaption{opacity:0}
.js-on:not(.fin) .sds,.js-on:not(.fin) .last{opacity:0}
@media (max-width:760px){
 .js-on .track{height:auto}
 .js-on .stage{position:static;height:auto;min-height:100vh}
 .row{flex-direction:column;align-items:stretch;gap:6px;padding:34px 0 18px}
 .m{display:grid;grid-template-columns:34vw 1fr;align-items:center;gap:6vw;width:100%;max-width:none;min-width:0;text-align:left}
 .m figcaption{margin:0}
 .end{flex-direction:column;gap:12px}
 h1{font-size:44px}
}
@media (prefers-reduced-motion:reduce){
 .js-on .track{height:auto}
 .js-on .stage{position:static;height:auto;min-height:100vh}
 .js-on .m:not(.on) .body,.js-on .m:not(.on) figcaption{opacity:1}
 .js-on:not(.fin) .sds,.js-on:not(.fin) .last{opacity:1}
}
</style>
</head>
<body>
<div class="track" id="track">
<main class="stage">
 <a class="logo" href="#" aria-label="Strapivo"><img src="../../assets/logo/strategy-mono-ink.svg" alt="Strapivo"></a>
 <div>
  <h1>Every decision carries its marks.</h1>
  <p class="lede">Strapivo is where a leadership team decides its strategy and traces each decision to its evidence.</p>
  <a class="cta" href="mailto:strategy@strapivo.com">Start the conversation</a>
 </div>

 <div class="row" role="img" aria-label="Five marks struck into silver: dated, primary source, decided, confirmed by a person, numbered for good.">
  <figure class="m on" data-i="0" aria-hidden="true">
   <svg viewBox="0 0 120 140"><path class="scribe" d="M12 10H108V70Q108 110 60 132Q12 110 12 70Z"/>
    <g class="body"><g transform="translate(1.6 1.6)"><path class="lt" d="M12 10H108V70Q108 110 60 132Q12 110 12 70Z"/></g><g transform="translate(-1.6 -1.6)"><path class="dk" d="M12 10H108V70Q108 110 60 132Q12 110 12 70Z"/></g><path class="fl" d="M12 10H108V70Q108 110 60 132Q12 110 12 70Z"/>
    <text class="ink s" x="60" y="61.4" font-size="25">12 MAR</text><text class="ink r" x="60" y="60" font-size="25">12 MAR</text></g></svg>
   <figcaption>Dated</figcaption></figure>
  <figure class="m on" data-i="1" aria-hidden="true">
   <svg viewBox="0 0 120 140"><path class="scribe" d="M28 10H92L110 28V112L92 130H28L10 112V28Z"/>
    <g class="body"><g transform="translate(1.6 1.6)"><path class="lt" d="M28 10H92L110 28V112L92 130H28L10 112V28Z"/></g><g transform="translate(-1.6 -1.6)"><path class="dk" d="M28 10H92L110 28V112L92 130H28L10 112V28Z"/></g><path class="fl" d="M28 10H92L110 28V112L92 130H28L10 112V28Z"/>
    <text class="ink s" x="60" y="95.4" font-size="76">P</text><text class="ink r" x="60" y="94" font-size="76">P</text></g></svg>
   <figcaption>Primary source</figcaption></figure>
  <figure class="m" data-i="2" aria-hidden="true">
   <svg viewBox="0 0 120 140"><path class="scribe" d="M60 8L108 36V104L60 132L12 104V36Z"/>
    <g class="body"><g transform="translate(1.6 1.6)"><path class="lt" d="M60 8L108 36V104L60 132L12 104V36Z"/></g><g transform="translate(-1.6 -1.6)"><path class="dk" d="M60 8L108 36V104L60 132L12 104V36Z"/></g><path class="fl" d="M60 8L108 36V104L60 132L12 104V36Z"/>
    <text class="ink s" x="60" y="79.4" font-size="25">ADAPT</text><text class="ink r" x="60" y="78" font-size="25">ADAPT</text></g></svg>
   <figcaption>Decided</figcaption></figure>
  <figure class="m" data-i="3" aria-hidden="true">
   <svg viewBox="0 0 120 140"><path class="scribe" d="M60 6L110 70L60 134L10 70Z"/>
    <g class="body"><g transform="translate(1.6 1.6)"><path class="lt" d="M60 6L110 70L60 134L10 70Z"/></g><g transform="translate(-1.6 -1.6)"><path class="dk" d="M60 6L110 70L60 134L10 70Z"/></g><path class="fl" d="M60 6L110 70L60 134L10 70Z"/>
    <path class="tick" stroke="rgba(30,33,38,.6)" stroke-width="7" d="M40 72L54 86L82 54"/><path class="tick" stroke="#E9EBEE" stroke-width="7" d="M40 70.6L54 84.6L82 52.6"/></g></svg>
   <figcaption>Confirmed by a person</figcaption></figure>
  <figure class="m" data-i="4" aria-hidden="true">
   <svg viewBox="0 0 120 140"><path class="scribe" d="M14 132V60A46 46 0 0 1 106 60V132Z"/>
    <g class="body"><g transform="translate(1.6 1.6)"><path class="lt" d="M14 132V60A46 46 0 0 1 106 60V132Z"/></g><g transform="translate(-1.6 -1.6)"><path class="dk" d="M14 132V60A46 46 0 0 1 106 60V132Z"/></g><path class="fl" d="M14 132V60A46 46 0 0 1 106 60V132Z"/>
    <text class="ink s" x="60" y="91.4" font-size="42">014</text><text class="ink r" x="60" y="90" font-size="42">014</text></g></svg>
   <figcaption>Numbered for good</figcaption></figure>
 </div>

 <div class="end">
  <p class="sds" id="sds">SDS-2026-014. Illustrative.</p>
  <p class="last" id="last">Ask where a number came from. <a href="mailto:strategy@strapivo.com">The record answers.</a></p>
 </div>
 <footer><span>© 2026 Strapivo</span><a href="/imprint">Imprint</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer>
</main>
</div>
<div id="flash"></div>
<script>
(function(){
 var d=document.documentElement,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(rm)return;
 d.classList.add('js-on');
 var ms=[].slice.call(document.querySelectorAll('.m')),flash=document.getElementById('flash'),track=document.getElementById('track');
 function hit(){flash.animate([{opacity:0},{opacity:.4,offset:.4},{opacity:0}],{duration:120})}
 function set(i,on){var m=ms[i];if(m.classList.contains('on')===on)return;m.classList.toggle('on',on);if(on)hit()}
 function fin(on){d.classList.toggle('fin',on)}
 var th=[.15,.42,.68];
 function upd(){
  if(innerWidth<=760)return;
  var r=track.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(track.offsetHeight-innerHeight)));
  for(var k=0;k<3;k++)set(k+2,p>=th[k]);
  fin(p>=.85);
 }
 if(innerWidth<=760){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){set(+e.target.dataset.i,true);io.unobserve(e.target)}})},{threshold:.8});
  ms.slice(2).forEach(function(m){io.observe(m)});
  var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)fin(true)})},{threshold:.5});
  io2.observe(document.getElementById('last'));
 }
 addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();
})();
</script>
<script src="/landings/prompt.js" defer></script>
</body>
</html>
