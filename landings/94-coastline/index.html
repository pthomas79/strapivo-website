<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strapivo. The coast moved. The map did not.</title>
<meta name="description" content="Strapivo is where a leadership team keeps its strategy and checks it against the world every week.">
<link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F5EF;--ink:#16181D;--azure:#1463D8;--verm:#DD3E1A;--land:#EEE7D5;--serif:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
a:focus-visible{outline:2px solid var(--azure);outline-offset:4px}

.track{position:relative;height:100vh;height:100svh;min-height:600px}
.live .track{height:520vh}
.stage{position:relative;top:0;height:100vh;height:100svh;min-height:600px;overflow:hidden;background:var(--paper)}
.live .stage{position:sticky}

.map{position:absolute;inset:31px;overflow:hidden}
.chart{position:absolute;inset:0;width:100%;height:100%;display:block}
.chart-P{display:none}

.landfill{fill:var(--land)}
.contour{fill:none;stroke:#8A8576;stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.contour.c2{stroke-dasharray:1 8;opacity:.75}
.gaptint{fill:var(--verm);opacity:.07}
.now{fill:none;stroke:var(--azure);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.survey{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sweep{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.sweep-halo{stroke:var(--paper);stroke-width:7;opacity:.85;vector-effect:non-scaling-stroke}
.snd{font-family:var(--serif);font-style:italic;font-size:19px;fill:#6F6A5D;text-anchor:middle}
.lbl{font-family:var(--serif);font-style:italic;font-size:24px;fill:var(--ink)}
.lbl.big{font-size:34px}
.lbl.verm{fill:#B02E0F}
.chart-P .snd{font-size:30px}
.chart-P .lbl{font-size:30px}
.chart-P .lbl.big{font-size:34px}
.tick{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}

/* neatline */
.nl{position:absolute;pointer-events:none;border:1px solid var(--ink);z-index:3}
.nl-t,.nl-b{left:16px;right:16px;height:7px;background:repeating-linear-gradient(90deg,var(--ink) 0 56px,transparent 56px 112px)}
.nl-t{top:16px}.nl-b{bottom:16px}
.nl-l,.nl-r{top:16px;bottom:16px;width:7px;background:repeating-linear-gradient(180deg,var(--ink) 0 56px,transparent 56px 112px)}
.nl-l{left:16px}.nl-r{right:16px}
.nl-in{inset:30px;border-width:1px}

.title{position:absolute;z-index:4;left:clamp(48px,5.4vw,96px);top:clamp(52px,8.5vh,96px);max-width:40rem}
.logo{display:inline-block;line-height:0}
.logo img{height:24px;width:auto;display:block}
h1{font-weight:500;font-size:clamp(44px,5.6vw,92px);line-height:.96;letter-spacing:-.012em;margin:30px 0 22px}
h1 span{display:block}
h1 em{font-style:italic;color:var(--azure)}
.lede{font-size:clamp(19px,1.5vw,23px);line-height:1.38;margin:0;max-width:24em;text-wrap:pretty}
.act{margin-top:28px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.cta{font-family:var(--mono);font-size:15px;background:var(--ink);color:var(--paper);padding:14px 22px;text-decoration:none;letter-spacing:.01em}
.cta:hover{background:var(--azure)}
.signin{font-family:var(--mono);font-size:14px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}

.scale{position:absolute;z-index:4;right:clamp(56px,4.6vw,80px);top:clamp(54px,7vh,72px);font-family:var(--mono);font-size:14px}
.bar{display:flex;border:1px solid var(--ink);height:8px;width:224px}
.bar i{flex:1;border-right:1px solid var(--ink)}
.bar i:nth-child(odd){background:var(--ink)}
.bar i:last-child{border-right:0}
.nums{display:flex;justify-content:space-between;width:224px;margin-top:6px}
.nums span{width:0;display:flex;justify-content:center;white-space:nowrap}
.nums span:last-child{justify-content:flex-start;margin-left:-4px}
.unit{margin-top:4px;text-align:right;font-family:var(--serif);font-style:italic;font-size:17px}

footer{font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px clamp(16px,3vw,48px) 26px;border-top:1px solid var(--ink)}
footer .end{font-size:15px;text-decoration:none;border-bottom:1px solid var(--azure);color:var(--azure);padding-bottom:2px}
footer nav{display:flex;gap:18px;align-items:center}

@media (max-aspect-ratio:1/1){
  .chart-L{display:none}.chart-P{display:block}
  .nl-t,.nl-b{left:8px;right:8px;height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 40px,transparent 40px 80px)}
  .nl-t{top:8px}.nl-b{bottom:8px}
  .nl-l,.nl-r{top:8px;bottom:8px;width:6px;background:repeating-linear-gradient(180deg,var(--ink) 0 40px,transparent 40px 80px)}
  .nl-l{left:8px}.nl-r{right:8px}
  .nl-in{inset:20px}
  .map{inset:21px}
  .title{left:21px;right:21px;top:21px;max-width:none;padding:22px 20px 34px;background:linear-gradient(var(--paper) 82%,rgba(247,245,239,0))}
  .logo img{height:19px}
  h1{font-size:clamp(38px,11vw,60px);margin:20px 0 14px}
  .lede{font-size:17px;max-width:21em}
  .act{margin-top:20px;gap:20px}
  .cta{padding:12px 16px;font-size:14px}
  .act{gap:18px}
  .scale{right:auto;left:38px;top:auto;bottom:40px;background:rgba(247,245,239,.85);padding:6px 6px 4px}
  .bar,.nums{width:100px}
  .scale{bottom:32px;left:auto;right:36px;background:none;padding:0}
}
@media (max-aspect-ratio:1/1) and (max-width:370px){
  .title{padding:18px 14px 28px}
  h1{font-size:36px}
  .lede{font-size:16px}
}
</style>
</head>

<script id="geo">
var GEO = (function () {
  var T = Math.PI * 2, N = 340;
  var O = {
    L: { key: "L", W: 1600, H: 1000, len: 1600, base: 690, k: 1.15, edge: 1030, horiz: true },
    P: { key: "P", W: 800, H: 1600, len: 1600, base: 478, k: 0.74, edge: 830, horiz: false }
  };
  function base(u) {
    return 62 * Math.sin(T * (0.9 * u + 0.08)) + 40 * Math.sin(T * 2.3 * u + 1.3) +
      19 * Math.sin(T * 5.1 * u + 0.4) + 9.5 * Math.sin(T * 11.7 * u + 2.1) +
      5 * Math.sin(T * 23.3 * u + 0.7) + 2.6 * Math.sin(T * 47.1 * u + 1.9) +
      1.3 * Math.sin(T * 93.7 * u + 0.3) + 0.7 * Math.sin(T * 181 * u + 1.1);
  }
  function smooth(u) {
    return 62 * Math.sin(T * (0.9 * u + 0.08)) + 40 * Math.sin(T * 2.3 * u + 1.3) + 8 * Math.sin(T * 5.1 * u + 0.4);
  }
  function drift(u, t, lo) {
    var bump = 165 * Math.exp(-Math.pow((u - 0.73) / 0.1, 2)) * (0.86 + 0.14 * Math.sin(0.5 * t));
    var spit = -46 * Math.exp(-Math.pow((u - 0.93) / 0.045, 2)) * (0.8 + 0.2 * Math.sin(0.37 * t + 1));
    var w = 26 * Math.sin(T * 1.7 * u + 0.31 * t + 0.5) + 15 * Math.sin(T * 3.9 * u - 0.23 * t + 2) +
      (lo ? 0 : 7 * Math.sin(T * 9.3 * u + 0.47 * t + 1) + 3.2 * Math.sin(T * 19.4 * u - 0.6 * t) +
      1.4 * Math.sin(T * 41 * u + 0.9 * t + 0.4));
    return bump + spit + w * (0.45 + 0.55 * u);
  }
  function pt(o, u, v) {
    var s = -40 + u * (o.len + 80), c = o.base + o.k * v;
    return o.horiz ? [s, c] : [c, s];
  }
  function along(o, u) { return -40 + u * (o.len + 80); }
  function f(n) { return Math.round(n * 10) / 10; }
  function seg(p) {
    var s = "";
    for (var i = 0; i < p.length; i++) s += (i ? "L" : "M") + f(p[i][0]) + " " + f(p[i][1]);
    return s;
  }
  function frame(o, t, amp, sw) {
    var neu = [], old = [], nowAll = [], nowOld = [];
    var swc = Math.max(0, Math.min(1, sw));
    for (var i = 0; i <= N; i++) {
      var u = i / N, vb = base(u), va = vb + amp * drift(u, t);
      var pa = pt(o, u, va), pb = pt(o, u, vb);
      nowAll.push(pa);
      if (u <= swc) neu.push(pa);
      if (u >= swc) { old.push(pb); nowOld.push(pa); }
      if (i < N && u < swc && (i + 1) / N > swc) {
        var vb2 = base(swc), va2 = vb2 + amp * drift(swc, t);
        neu.push(pt(o, swc, va2)); old.push(pt(o, swc, vb2)); nowOld.push(pt(o, swc, va2));
      }
    }
    var line = neu.concat(old), a = line[0], b = line[line.length - 1];
    var land = seg(line) + (o.horiz ? "L" + f(b[0]) + " " + o.edge + "L" + f(a[0]) + " " + o.edge : "L" + o.edge + " " + f(b[1]) + "L" + o.edge + " " + f(a[1])) + "Z";
    var c1 = [], c2 = [];
    for (var j = 0; j <= 120; j++) {
      var w = j / 120, m = amp * drift(w, t, 1) * (1 - sstep(swc - 0.05, swc + 0.05, w)), sm = smooth(w) + m;
      c1.push(pt(o, w, sm - 48)); c2.push(pt(o, w, sm - 120));
    }
    var gap = old.length > 1 ? seg(old.concat(nowOld.slice().reverse())) + "Z" : "";
    return {
      now: seg(nowAll),
      survey: (neu.length > 1 ? seg(neu) : "") + (old.length > 1 ? seg(old) : ""),
      land: land, gap: gap, c1: seg(c1), c2: seg(c2), s: f(along(o, sw))
    };
  }
  function sstep(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  function contour(o, off) {
    var p = [];
    for (var i = 0; i <= 120; i++) { var u = i / 120; p.push(pt(o, u, smooth(u) - off)); }
    return seg(p);
  }
  return { O: O, base: base, smooth: smooth, drift: drift, pt: pt, along: along, frame: frame, contour: contour };
})();
</script>
<script>
(function () {
  if (!window.matchMedia || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var root = document.documentElement, track = document.getElementById("track"), stage = document.getElementById("stage");
  root.classList.add("live");
  var mqP = matchMedia("(max-aspect-ratio: 1/1)");
  function grab(svg) {
    var q = function (s) { return svg.querySelector(s); };
    return {
      svg: svg, o: GEO.O[svg.getAttribute("data-o")],
      land: q(".landfill"), c1: q(".contour"), c2: q(".contour.c2"), tint: q(".gaptint"), gap: q(".gap"), now: q(".now"), survey: q(".survey"),
      sweep: svg.querySelectorAll(".sweep, .sweep-halo"), slbl: q(".sweep-lbl"), svlbl: q(".survey-lbl"), old: q(".old-lbl")
    };
  }
  var charts = { L: grab(document.querySelector(".chart-L")), P: grab(document.querySelector(".chart-P")) };
  function cl(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function ss(a, b, x) { x = cl((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
  function prog() {
    var r = track.getBoundingClientRect(), tot = r.height - innerHeight;
    return tot > 0 ? cl(-r.top / tot, 0, 1) : 0;
  }
  var t0 = performance.now(), on = false, inView = true;
  function draw(now) {
    var c = charts[mqP.matches ? "P" : "L"], o = c.o, p = prog();
    var t = 2 + (now - t0) / 1000 * 0.35;
    var amp = 0.1 + 0.9 * ss(0.0, 0.42, p);
    var sw = -0.04 + 1.1 * cl((p - 0.5) / 0.4, 0, 1);
    var g = GEO.frame(o, t, amp, sw);
    c.land.setAttribute("d", g.land); c.now.setAttribute("d", g.now); c.survey.setAttribute("d", g.survey);
    c.gap.setAttribute("d", g.gap); c.c1.setAttribute("d", g.c1); c.c2.setAttribute("d", g.c2); c.tint.setAttribute("d", g.gap);
    for (var i = 0; i < c.sweep.length; i++) {
      if (o.horiz) { c.sweep[i].setAttribute("x1", g.s); c.sweep[i].setAttribute("x2", g.s); }
      else { c.sweep[i].setAttribute("y1", g.s); c.sweep[i].setAttribute("y2", g.s); }
    }
    var sv = ss(0.0, 0.04, sw), sl = 1 - ss(0.97, 1.04, sw);
    if (o.horiz) { c.slbl.setAttribute("x", Math.min(g.s + 14, 1290)); }
    else { c.slbl.setAttribute("y", Math.min(g.s - 16, 1380)); }
    c.slbl.style.opacity = sv;
    c.sweep[0].style.opacity = sv * sl * 0.85; c.sweep[1].style.opacity = sv * sl;
    var usv = +c.svlbl.getAttribute("data-u");
    c.svlbl.style.opacity = 1 - ss(usv - 0.08, usv - 0.01, sw);
    c.old.style.opacity = ss(0.24, 0.38, p) * (1 - ss(0.6, 0.68, sw));
  }
  function tick(now) { if (!on) return; draw(now); requestAnimationFrame(tick); }
  function update() {
    var want = inView && !document.hidden;
    if (want && !on) { on = true; requestAnimationFrame(tick); }
    else if (!want) on = false;
  }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (e) { inView = e[0].isIntersecting; update(); }).observe(stage);
  }
  document.addEventListener("visibilitychange", update);
  update();
})();
</script>
