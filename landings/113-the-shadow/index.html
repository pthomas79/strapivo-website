<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strapivo. Mark where the shadow was</title>
<meta name="description" content="Strapivo is where a leadership team keeps its strategy and records what moved between sessions.">
<link rel="icon" href="../../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--stone:#EFE6D6;--shadow:#33346B;--brass:#9C7424;--ink:#23223F}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--stone)}
body{background:var(--stone);color:var(--ink);font-family:Jost,"Helvetica Neue",Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--shadow);outline-offset:4px}
.wrap{position:relative}
.js .wrap{height:350vh}
.stage{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;
  background:radial-gradient(ellipse 90% 80% at 20% 15%,#F6EFE1 0%,#EFE6D6 55%,#E6DAC4 100%)}
.js .stage{position:sticky;top:0}
#art{position:absolute;inset:0;width:100%;height:100%;display:block}
#art text{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;fill:#4A3A12}
#art .dim text{fill:var(--shadow)}
.logo{position:absolute;left:clamp(20px,4vw,56px);top:clamp(20px,3.6vh,36px);z-index:3;display:block}
.logo img{height:24px;width:auto;display:block}
.signin{position:absolute;right:clamp(20px,4vw,56px);top:clamp(18px,3.6vh,34px);z-index:3;font-size:15px;font-weight:400;letter-spacing:.04em;text-decoration:none;border-bottom:1px solid var(--shadow);padding-bottom:2px}
.copy{position:absolute;right:clamp(20px,5vw,80px);bottom:clamp(36px,6vh,60px);width:min(30vw,440px);z-index:2}
h1{font-weight:300;font-size:clamp(30px,2.8vw,42px);line-height:1.08;letter-spacing:-.015em}
.lede{margin-top:20px;font-size:clamp(16px,1.25vw,18px);line-height:1.45;font-weight:400;max-width:30em}
.cta{display:inline-block;margin-top:26px;padding:14px 26px;background:var(--shadow);color:#F6EFE1;text-decoration:none;font-weight:400;font-size:16px;letter-spacing:.03em}
.cta:hover{background:#25265a}
.close{position:absolute;left:clamp(20px,4vw,56px);bottom:clamp(28px,7vh,70px);z-index:2;font-size:clamp(18px,1.6vw,24px);font-weight:300;max-width:12em;line-height:1.25}
.foot{position:absolute;left:0;right:0;bottom:8px;z-index:3;text-align:center;font-size:12px;opacity:.75}
.foot a{margin-left:10px}
@media (max-width:760px){
  .copy{left:20px;right:20px;top:68px;bottom:auto;width:auto}
  h1{font-size:27px}
  .lede{margin-top:12px;font-size:15.5px;line-height:1.4}
  .cta{margin-top:16px;padding:12px 22px}
  .close{display:none}
  .foot{bottom:6px}
}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<div class="wrap" id="wrap">
<div class="stage" id="stage">
<a class="logo" href="#"><img src="../../assets/logo/strategy-mono-ink.svg" alt="Strapivo"></a>
<a class="signin" href="https://strapivo.app">Sign in</a>
<svg id="art" role="img" aria-label="Seen from above, a post casts a long shadow across paving. A brass stud marks where the shadow tip stood at each of six weekly sessions, with the distance between sessions measured." viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"><!--ART--></svg>
<div class="copy">
<h1>You cannot watch a shadow move. You can mark where it was.</h1>
<p class="lede">Strapivo is where a leadership team keeps its strategy and records what moved between sessions.</p>
<a class="cta" href="mailto:strategy@strapivo.com">Start the conversation</a>
</div>
<p class="close" id="close">Show the board what moved between meetings.</p>
<p class="foot">© 2026 Strapivo <a href="/imprint">Imprint</a> <a href="/privacy">Privacy</a> <a href="/terms">Terms</a></p>
</div>
</div>
<script>
(function(){
var DATES=["5 Mar","12 Mar","19 Mar","26 Mar","2 Apr","9 Apr"],ANG=[12,21,30,39,48,57];
function cl(x){return x<0?0:x>1?1:x}
function build(W,H,angle,dp){
  var ph=W<=760,px=ph?.07*W:.30*W,py=ph?.87*H:.73*H,L=ph?.72*W:.48*W,g=ph?W/3:.12*W,s='';
  var r=function(n){return Math.round(n*10)/10};
  s+='<defs><linearGradient id="sg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#26275A"/><stop offset="1" stop-color="#3C3D7C"/></linearGradient><filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter></defs>';
  for(var x=g*.5;x<W;x+=g)s+='<line x1="'+r(x)+'" y1="0" x2="'+r(x)+'" y2="'+H+'" stroke="#8A7A5A" stroke-opacity=".16" stroke-width="1"/>';
  for(var y=H%g/2;y<H;y+=g)s+='<line x1="0" y1="'+r(y)+'" x2="'+W+'" y2="'+r(y)+'" stroke="#8A7A5A" stroke-opacity=".16" stroke-width="1"/>';
  s+='<circle cx="'+r(px)+'" cy="'+r(py)+'" r="'+r(L)+'" fill="none" stroke="#33346B" stroke-opacity=".22" stroke-width="1" stroke-dasharray="2 7"/>';
  var t='translate('+r(px)+' '+r(py)+') rotate('+r(-angle)+')';
  s+='<g transform="'+t+'"><rect x="0" y="-14" width="'+r(L)+'" height="28" fill="#33346B" opacity=".35" filter="url(#bl)"/><rect x="0" y="-14" width="'+r(L)+'" height="28" fill="url(#sg)"/></g>';
  var tips=[];
  ANG.forEach(function(a,i){
    var rad=a*Math.PI/180,cx=px+L*Math.cos(rad),cy=py-L*Math.sin(rad);tips.push([cx,cy]);
    var v=a<=39?1:cl((angle-a)/1.2+1);
    if(v<=0)return;
    var lab=(!ph||i==0||i==5)?'<text text-anchor="end" x="'+r(i==5?cx-14:cx-18)+'" y="'+r(i==5?cy-12:cy+5)+'" opacity="'+r(v)+'">'+DATES[i]+'</text>':'';
    s+='<g opacity="'+r(v)+'"><rect x="-9" y="-9" width="18" height="18" transform="translate('+r(cx+1.5)+' '+r(cy+2.5)+') rotate(45)" fill="#33346B" opacity=".25"/><rect x="-5" y="-5" width="10" height="10" transform="translate('+r(cx)+' '+r(cy)+') rotate(45)" fill="#B58A2E" stroke="#6E5214" stroke-width="1"/><rect x="-1.6" y="-1.6" width="3.2" height="3.2" transform="translate('+r(cx-1)+' '+r(cy-1)+') rotate(45)" fill="#F0D488"/></g>'+lab;
  });
  s+='<rect x="'+r(px-14)+'" y="'+r(py-14)+'" width="28" height="28" fill="#1E1E3C"/><rect x="'+r(px-14)+'" y="'+r(py-14)+'" width="28" height="9" fill="#5A5A93" opacity=".55"/>';
  if(dp>0){
    var d=function(a,b,off,lab,hor){
      var A=tips[a],B=tips[b],dx=B[0]-A[0],dy=B[1]-A[1],n=Math.sqrt(dx*dx+dy*dy),nx=-dy/n,ny=dx/n,mx=(A[0]+B[0])/2-px,my=(A[1]+B[1])/2-py;
      if(nx*mx+ny*my<0){nx=-nx;ny=-ny}
      var x1=A[0]+nx*off,y1=A[1]+ny*off,x2=B[0]+nx*off,y2=B[1]+ny*off,tk=9,ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;if(ang>90||ang<-90)ang+=180;
      var lx=(x1+x2)/2+nx*14,ly=(y1+y2)/2+ny*14;
      return '<g class="dim" stroke="#33346B" stroke-width="1.25" fill="none"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="'+r(1-dp)+'" d="M'+r(x1)+' '+r(y1)+'L'+r(x2)+' '+r(y2)+'M'+r(x1-nx*tk)+' '+r(y1-ny*tk)+'L'+r(x1+nx*tk)+' '+r(y1+ny*tk)+'M'+r(x2-nx*tk)+' '+r(y2-ny*tk)+'L'+r(x2+nx*tk)+' '+r(y2+ny*tk)+'"/><text stroke="none" fill="#33346B" text-anchor="'+(hor?'end':'middle')+'" opacity="'+r(cl((dp-.5)*2))+'" transform="'+(hor?'translate('+r(x2+34)+' '+r(y2-22)+')':'translate('+r(lx)+' '+r(ly)+') rotate('+r(ang)+')')+'" dy="10">'+lab+'</text></g>';
    };
    s+=d(4,5,ph?26:34,'Since the last session',ph)+d(0,5,ph?44:104,'Since the start');
    s+='<text x="'+r(px-14)+'" y="'+r(py+38)+'" opacity="'+r(dp)+'" style="fill:#6B5C3A;font-size:14px">Illustrative</text>';
  }
  return s;
}
var wrap=document.getElementById('wrap'),art=document.getElementById('art'),close=document.getElementById('close');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,p=reduce?1:0,raf=0;
function draw(){
  raf=0;
  var a=40+17*(1-Math.pow(1-cl(p/.8),2)),dp=cl((p-.82)/.16);
  if(reduce){a=57;dp=1}
  art.innerHTML=build(W,H,a,dp);
  close.style.opacity=reduce?1:r2(cl((p-.9)/.1));
}
function r2(x){return Math.round(x*100)/100}
function size(){W=Math.max(300,window.innerWidth);H=Math.max(560,window.innerHeight);art.setAttribute('viewBox','0 0 '+W+' '+H);art.setAttribute('preserveAspectRatio','none')}
function scroll(){
  if(reduce)return;
  var tot=wrap.offsetHeight-window.innerHeight,y=-wrap.getBoundingClientRect().top;
  p=tot>0?cl(y/tot):1;
  if(!raf)raf=requestAnimationFrame(draw);
}
if(reduce)wrap.style.height='auto',document.getElementById('stage').style.position='relative';
size();scroll();draw();
window.addEventListener('scroll',scroll,{passive:true});
window.addEventListener('resize',function(){size();scroll();draw()});
})();
</script>
<script src="/landings/prompt.js" defer></script>
</body>
</html>
