<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-edit="meta.title">Strapivo</title>
  <style>
    /* Placeholder styles — replace with Canva design */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; color: #1a1a2e; }
    .hero { padding: 80px 40px; text-align: center; }
    footer { padding: 24px 40px; text-align: center; font-size: 0.8rem; color: #888; }
    footer a { color: #888; text-decoration: none; }
  </style>
</head>
<body>

  <!-- Replace this entire body content with the Canva design export -->
  <section class="hero">
    <h1 data-edit="hero.h1">Strapivo</h1>
    <p data-edit="hero.tagline">Coming soon.</p>
  </section>

  <footer>
    <p data-edit="footer.copy">&copy; 2026 Strapivo</p>
    <a href="/api/auth/login" style="opacity: 0.3; font-size: 0.75rem; margin-left: 16px;">Admin</a>
  </footer>

  <!-- Admin CMS bootstrap — only loads for authenticated admins -->
  <script>
    (function () {
      function getCookie(name) {
        return (document.cookie.split(';').map(function (c) { return c.trim(); }).find(function (c) { return c.startsWith(name + '='); }) || '').split('=')[1] || '';
      }
      if (getCookie('admin_hint') === '1') {
        var s = document.createElement('script');
        s.src = '/admin.js';
        s.defer = true;
        document.head.appendChild(s);
      }
    })();
  </script>

</body>
</html>
